<!doctype html>
<!-- Bloom v32: approved painterly visual direction + confirmed trigger capture -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fffaf5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bloom">
<link rel="manifest" href="manifest.webmanifest">
<title>Bloom</title>
<link rel="stylesheet" href="styles.css?v=31">
<link rel="stylesheet" href="trigger-assets.css?v=31">
<link rel="stylesheet" href="trigger-interactions.css?v=31">
<link rel="stylesheet" href="baseline-overlay.css?v=31">
<link rel="stylesheet" href="design-v32.css?v=32">
</head>
<body>
<div class="garden" aria-hidden="true"><div class="glow"></div><div class="botanical botanical-left"></div><div class="botanical botanical-right"></div></div>
<div class="app-shell">
<header class="topbar">
  <div><div class="brand-word">Bloom</div><div class="today-date" id="todayDate"></div></div>
  <button class="settings-pill" id="settingsBtn" aria-label="Settings">Settings</button>
</header>
<main>
<section id="baselineScreen" class="screen"></section>
<section id="todayScreen" class="screen">
  <div class="home-heading"><span>TODAY</span><span id="cycleBadge" class="cycle-badge" hidden></span></div>
  <div class="home-hero">
    <button id="lotusCheckin" class="lotus-card" aria-label="Check in">
      <img class="lotus-visual" src="assets/lotus-check-in.webp" alt="" aria-hidden="true">
      <span class="lotus-label">CHECK IN</span>
    </button>
    <div id="baselineDoneNote" class="micro-note"></div>
  </div>
  <section class="meds-home" id="medsStrip"></section>
  <div class="quick-label">TRIGGERS</div>
  <div class="quick-grid" aria-label="Visual triggers">
    <button class="quick-tile nap" data-quick="nap" aria-label="Sleep" aria-pressed="false" title="Sleep"><img class="trigger-art" src="assets/triggers/sleep.png" alt=""></button>
    <button class="quick-tile caffeine" data-quick="caffeine" aria-label="Caffeinate" aria-pressed="false" title="Caffeinate"><img class="trigger-art" src="assets/triggers/caffeinate.png" alt=""></button>
    <button class="quick-tile alcohol" data-quick="alcohol" aria-label="Alcohol" aria-pressed="false" title="Alcohol"><img class="trigger-art" src="assets/triggers/alcohol.png" alt=""></button>
    <button class="quick-tile breathing" data-quick="breathing" aria-label="Breathe" aria-pressed="false" title="Breathe"><img class="trigger-art" src="assets/triggers/breathe.png" alt=""></button>
    <button class="quick-tile water" data-quick="water" aria-label="Hydrate" aria-pressed="false" title="Hydrate"><img class="trigger-art" src="assets/triggers/hydrate.png" alt=""></button>
    <button class="quick-tile sensory" data-quick="sensory-overload" aria-label="Sense" aria-pressed="false" title="Sense"><img class="trigger-art" src="assets/triggers/sense.png" alt=""></button>
  </div>
  <section class="context-row">
    <button class="context-chip" id="cycleHomeBtn"><span class="context-kicker">CYCLE</span><strong id="cycleHomeText">Open cycle</strong></button>
    <button class="context-chip" id="healthHomeBtn"><span class="context-kicker">APPLE HEALTH</span><strong id="healthHomeText">Import snapshot</strong></button>
  </section>
</section>
<section id="checkinScreen" class="screen"></section>
<section id="cycleScreen" class="screen"></section>
<section id="historyScreen" class="screen"></section>
<section id="patternsScreen" class="screen"></section>
</main>
<nav class="bottom-nav" aria-label="Bloom navigation">
<button data-nav="today" class="active">Today</button><button data-nav="checkin">Check-in</button><button data-nav="cycle">Cycle</button><button data-nav="history">History</button><button data-nav="patterns">Patterns</button>
</nav>
</div>
<div id="modal" class="modal-backdrop" hidden><div class="modal-card"><button class="modal-close" id="modalClose" aria-label="Close">×</button><div id="modalBody"></div></div></div>
<input id="healthFile" type="file" accept="application/json,.json" hidden><input id="importFile" type="file" accept="application/json,.json" hidden>
<script src="app.js?v=32"></script>
</body>
</html>
